<mat-form-field appearance="outline" class="w-100">
  <input
    matInput
    [id]="inputId"
    [formControl]="text"
    [errorStateMatcher]="errorStateMatcher"
    (blur)="onTouched()"
    inputmode="decimal"
    autocomplete="off"
  />
  <mat-error>{{ errorMessage }}</mat-error>
</mat-form-field>
